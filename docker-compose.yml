services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gavran_root_local}
      MYSQL_DATABASE: gavran
      MYSQL_USER: gavran
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gavran_local}
    ports:
      - "${MYSQL_PORT:-3317}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    volumes:
      - gavran_mysql:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  gavran_mysql:
